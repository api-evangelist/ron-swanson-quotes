name: Ron Swanson Quotes
description: >-
  A community-built, open source HTTP API that returns Ron Swanson quotes from the NBC television series Parks and
  Recreation. Returns one or more quotes per request as a JSON array of strings, with an optional case-insensitive
  full-text search over the quote corpus. The service is a small Node.js / TypeScript Express app authored by James
  Wright and hosted on Heroku.
